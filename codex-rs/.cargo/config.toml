[build]
# Two build jobs per core reduced cold-worktree wall time without exceeding
# this Mac's open-file limit; 64 jobs failed before compilation could start.
jobs = 32

[env]
# The sandbox-enabled V8 artifacts for this local checkout are described in the
# root AGENTS.md. Explicit shell environment variables can override these paths.
RUSTY_V8_ARCHIVE = "/Users/viktor/.cache/rusty-v8-codex/librusty_v8_ptrcomp_sandbox_release_aarch64-apple-darwin.a.gz"
RUSTY_V8_SRC_BINDING_PATH = "/Users/viktor/.cache/rusty-v8-codex/src_binding_ptrcomp_sandbox_release_aarch64-apple-darwin.rs"

[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "target-feature=+crt-static"]

# MSVC emits a warning about code that may trip "Cortex-A53 MPCore processor bug #843419" (see
# https://developer.arm.com/documentation/epm048406/latest) which is sometimes emitted by LLVM.
# Since Arm64 Windows 10+ isn't supported on that processor, it's safe to disable the warning.
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "link-arg=/arm64hazardfree"]

[target.'cfg(all(windows, target_env = "gnu"))']
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]
